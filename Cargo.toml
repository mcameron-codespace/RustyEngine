[package]
name = "rustyengine"
version = "0.1.0"
edition = "2024"

[dependencies]
bumpalo = { version = "3.16", features = ["collections"] }
winit = "0.29"
wgpu = "0.19"
pollster = "0.3"
rapier3d = "0.18"
nalgebra = "0.32"
kira = { version = "0.8", default-features = false, features = ["cpal", "mp3", "wav"] }
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
